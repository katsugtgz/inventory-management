<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laravel 13 + Filament 5 — Inventory Management</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b1220; color:#e6edf3; }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 4px; }
  h1 span { color: #7aa2f7; }
  p.lead { color:#9aa7bd; margin-top:0; }
  .badges { margin: 12px 0 28px; display:flex; gap:8px; flex-wrap:wrap; }
  .badges img { height:20px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 20px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  figure { margin:0; background:#111a2c; border:1px solid #1f2b45; border-radius:12px; overflow:hidden; }
  figure img { width:100%; display:block; border-bottom:1px solid #1f2b45; }
  figcaption { padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  figcaption strong { color:#c9d6e8; }
  figcaption span { color:#8b98ad; font-size:.85rem; }
  a { color:#7aa2f7; }
</style>
</head>
<body>
<main>
  <h1>Laravel 13 <span>+</span> Filament 5 Inventory Management</h1>
  <p class="lead">Master data, purchases &amp; sales with repeater line items, observer-driven stock ledger, adjustments, dashboard and filter-aware Excel/PDF reports.</p>
  <div class="badges">
    <img alt="CI" src="https://github.com/katsugtgz/inventory-management/actions/workflows/ci.yml/badge.svg">
    <img alt="License" src="https://img.shields.io/badge/license-MIT-blue.svg">
    <img alt="PHP" src="https://img.shields.io/badge/PHP-8.3%2B-8892bf.svg">
    <img alt="Laravel" src="https://img.shields.io/badge/Laravel-13-ff2d20.svg">
    <img alt="Filament" src="https://img.shields.io/badge/Filament-5-f5a623.svg">
  </div>
  <div class="grid">
      <figure>
        <img src="screenshots/01-dashboard.png" alt="Dashboard screenshot" loading="lazy">
        <figcaption><strong>Dashboard</strong><span>Total sales, purchases, stock &amp; adjustment stat cards; monthly sales line chart; top-5 products bar chart.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/02-products.png" alt="Products screenshot" loading="lazy">
        <figcaption><strong>Products</strong><span>Image upload, rich editor, category tree, cost/selling price, low-stock threshold.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/03-purchases.png" alt="Purchases screenshot" loading="lazy">
        <figcaption><strong>Purchases</strong><span>Supplier documents with Repeater line items; totals derived server-side.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/04-sales.png" alt="Sales screenshot" loading="lazy">
        <figcaption><strong>Sales</strong><span>Customer documents; stock auto-decreases via observers.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/05-stock-overview.png" alt="Stock Overview screenshot" loading="lazy">
        <figcaption><strong>Stock Overview</strong><span>Read-only ledger-derived stock per product/warehouse with low-stock alerts.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/06-profit-loss.png" alt="Profit &amp; Loss screenshot" loading="lazy">
        <figcaption><strong>Profit &amp; Loss</strong><span>Product-level revenue, cost, profit &amp; margin with filter-aware Excel + PDF export.</span></figcaption>
      </figure>

      <figure>
        <img src="screenshots/07-purchase-create.png" alt="Purchase Form screenshot" loading="lazy">
        <figcaption><strong>Purchase Form</strong><span>Repeater line items with live subtotal calculation.</span></figcaption>
      </figure>
  </div>
</main>
</body>
</html>
