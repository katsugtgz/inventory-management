services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PHP_CLI_SERVER_WORKERS: '8'
        volumes:
            - '.:/var/www/html'
            - 'vendor-nodel:/var/www/html/vendor'
            - './infrastructure/zz-app-cli.ini:/etc/php/8.5/cli/conf.d/99-zz-app-cli.ini:ro'
        networks:
            - sail
        depends_on:
            - mysql
    caddy:
        image: 'caddy:2-alpine'
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - './infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
    composer-sync:
        image: 'composer:2'
        working_dir: /app
        environment:
            COMPOSER_ALLOW_SUPERUSER: 1
            COMPOSER_CACHE_DIR: /tmp/cache
        volumes:
            - '.:/app'
            - 'vendor-nodel:/app/vendor'
        networks:
            - sail
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    vendor-nodel:
        driver: local
